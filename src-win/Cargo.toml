[workspace]
members = ["installer"]

[package]
name = "claudepet"
version = "0.3.0"
edition = "2021"
description = "ClaudePet - a desktop pet for Windows (Rust port of the macOS app)"
license = "MIT"

[[bin]]
name = "claudepet"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
mdns-sd = "0.11"
socket2 = "0.5"
flume = "0.11"

[build-dependencies]
winres = "0.1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
