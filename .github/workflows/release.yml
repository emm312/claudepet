name: release

# Auto-upload: push a tag like v0.2.0 and this builds claudepet.exe +
# claudepet-setup.exe on a Windows runner and attaches them (plus the
# sha256 the in-app updater checks) to the GitHub Release for that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build app + installer
        working-directory: src-win
        run: |
          cargo build --release -p claudepet
          cargo build --release -p claudepet-setup

      - name: Checksum
        working-directory: src-win
        shell: pwsh
        run: |
          $sha = (Get-FileHash target/release/claudepet.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path target/release/claudepet.exe.sha256 -Value $sha -Encoding ascii -NoNewline

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            src-win/target/release/claudepet.exe
            src-win/target/release/claudepet-setup.exe
            src-win/target/release/claudepet.exe.sha256
