[package]
name = "claudepet-setup"
version = "0.1.0"
edition = "2021"
description = "Install wizard for ClaudePet"
license = "MIT"

[[bin]]
name = "claudepet-setup"
path = "src/main.rs"

# Release profile is inherited from the workspace root (src-win/Cargo.toml).

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]
