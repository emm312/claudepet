name: release

# Manual only - run from the Actions tab, or `gh workflow run release.yml
# -f version=0.2.0` (omit `version` to use the root VERSION file). Builds
# claudepet.exe + claudepet-setup.exe on a Windows runner and ClaudePet-mac.zip
# on a macOS runner, then attaches all of them (plus the sha256 files the
# in-app updaters check) to the GitHub Release for that version's tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Defaults to the VERSION file."
        required: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="$(cat VERSION)"; fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build app + installer
        working-directory: src-win
        run: |
          cargo build --release -p claudepet
          cargo build --release -p claudepet-setup

      - name: Checksum
        working-directory: src-win
        shell: pwsh
        run: |
          $sha = (Get-FileHash target/release/claudepet.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path target/release/claudepet.exe.sha256 -Value $sha -Encoding ascii -NoNewline

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            src-win/target/release/claudepet.exe
            src-win/target/release/claudepet-setup.exe
            src-win/target/release/claudepet.exe.sha256

  build-macos:
    needs: create-release
    runs-on: macos-latest
    env:
      CODESIGN_IDENTITY: "ClaudePet CI Signing"
    steps:
      - uses: actions/checkout@v4

      # A stable, self-signed identity (not ad-hoc) keeps the app's designated
      # requirement - and so TCC grants like Accessibility - the same across
      # every CI build, matching what Scripts/bundle.sh does for local
      # rebuilds with a real Apple Development cert. Without this, an
      # ad-hoc-signed CI build's cdhash changes every run, and every
      # auto-update looks like a brand-new app to TCC.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CI_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CI_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN=build.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm cert.p12

      - name: Build app + zip
        run: |
          ./Scripts/bundle.sh
          ditto -c -k --sequesterRsrc --keepParent ClaudePet.app ClaudePet-mac.zip
          shasum -a 256 ClaudePet-mac.zip | awk '{print $1}' > ClaudePet-mac.zip.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            ClaudePet-mac.zip
            ClaudePet-mac.zip.sha256
