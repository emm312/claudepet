name: release

# Manual only - run from the Actions tab, or `gh workflow run release.yml
# -f version=0.2.0` (omit `version` to use the root VERSION file). Builds
# claudepet.exe + claudepet-setup.exe on a Windows runner and ClaudePet-mac.zip
# on a macOS runner, then attaches all of them (plus the sha256 files the
# in-app updaters check) to the GitHub Release for that version's tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Defaults to the VERSION file."
        required: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="$(cat VERSION)"; fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build app + installer
        working-directory: src-win
        run: |
          cargo build --release -p claudepet
          cargo build --release -p claudepet-setup

      - name: Checksum
        working-directory: src-win
        shell: pwsh
        run: |
          $sha = (Get-FileHash target/release/claudepet.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path target/release/claudepet.exe.sha256 -Value $sha -Encoding ascii -NoNewline

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            src-win/target/release/claudepet.exe
            src-win/target/release/claudepet-setup.exe
            src-win/target/release/claudepet.exe.sha256

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app + zip
        run: |
          ./Scripts/bundle.sh
          ditto -c -k --sequesterRsrc --keepParent ClaudePet.app ClaudePet-mac.zip
          shasum -a 256 ClaudePet-mac.zip | awk '{print $1}' > ClaudePet-mac.zip.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            ClaudePet-mac.zip
            ClaudePet-mac.zip.sha256
